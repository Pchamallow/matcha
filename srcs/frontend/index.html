<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>matcha</title>
	<script>
		async function welcome()
		{
			const API_URL = "http://localhost:3000/"
			try
			{
				const response = await fetch(API_URL);
				const myString = await response.text();
				alert(myString);
			} catch (error)
			{
				console.log(error);
			}
		}
	</script>
</head>
	<body>
		<h1>Hello world!</h1>
		<input id="name" type="text" placeholder="Your name...">
		<button onclick="welcome()">CLIQUE MOIIIIIIIIIIIIII</button>
	</body>
</html>
