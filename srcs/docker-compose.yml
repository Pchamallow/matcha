volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: /home/${USER}/data/mariadb
      o: bind
      type: none
  frontend:
    name: frontend
    driver: local
    driver_opts:
      device: /home/${USER}/data/frontend
      o: bind
      type: none

services:
  nginx:
    container_name: nginx
    build: ./nginx
    networks:
      - matcha
    volumes:
      - frontend:/var/www/html
    depends_on:
      - frontend
    ports:
      - "443:443"
    env_file:
      - .env
    restart: on-failure
  mariadb:
    container_name: mariadb
    build: ./mariadb
    networks:
      - matcha
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - .env
    restart: on-failure
  frontend:
    container_name: frontend
    build: ./frontend
    networks:
      - matcha
    volumes:
      - frontend:/var/www/html
    depends_on:
      - mariadb
    env_file:
      - .env
    restart: on-failure

networks:
  matcha:
    name: matcha
    driver: bridge
