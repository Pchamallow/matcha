services:
  mariadb:
    image: mariadb:lts-ubi10
    container_name: mariadb
    env_file:
      - .env
    networks:
      - matcha
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb_volume:/var/lib/mysql/
      - ./srcs/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql
    # ports:
    #   - 8888:3306

  backend:
    image: backend
    build: srcs/backend
    container_name: backend
    env_file:
      - .env
    networks:
      - matcha
    ports:
      - 3000:3000

  frontend:
    image: frontend
    build: srcs/frontend
    container_name: frontend
    env_file:
      - .env
    networks:
      - matcha
    volumes:
      - frontend_volume:/usr/share/nginx/html
    ports:
      - 8080:80

networks:
  matcha:
    driver: bridge

volumes:
  frontend_volume:
  mariadb_volume:
