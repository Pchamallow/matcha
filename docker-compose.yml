services:
  frontend:
    image: frontend
    build: ./frontend
    container_name: frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - matcha
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - 5173:5173

  backend:
    image: backend
    build: ./backend
    container_name: backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - matcha
    env_file:
      - .env
    ports:
      - 3000:3000
      - 3001:3001

networks:
  matcha:
    name: matcha
    driver: bridge

volumes:
  frontend-node-modules:
